<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixTrack - Report a Campus Issue</title>
    <!-- Linking external CSS stylesheet -->
    <link rel="stylesheet" href="report.css" />
  </head>
  <body>
    <nav class="floating-navbar">
      <a href="#" class="logo">FixTrack</a>

      <ul class="nav-links">
        <li><a href="#">Board</a></li>
        <li><a href="#" class="active">Report an Issue</a></li>
        <li><a href="#">Triage & Manager</a></li>
        <li><a href="#">Analytics</a></li>
        <li><a href="#">Issues</a></li>
      </ul>

      <div class="nav-right">
        <div class="search-box">
          <svg
            class="search-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" placeholder="Search issues, tags, buildings..." />
        </div>

        <button class="notif-btn" aria-label="Notifications">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="notif-dot"></span>
        </button>

        <div class="user-profile">
          <div class="avatar">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="user-details">
            <span class="user-name">Campus Ops</span>
            <span class="user-status">ACTIVE</span>
          </div>
        </div>
      </div>
    </nav>

  </body>
</html>
